name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PM2: /root/.nvm/versions/node/v22.14.0/bin/pm2

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Diagnose VPS connectivity
        run: |
          echo "=== DNS resolution ==="
          nslookup ${{ secrets.VPS_HOST }} || true
          echo "=== TCP reachability on port 22 ==="
          nc -zv -w 5 ${{ secrets.VPS_HOST }} 22 || true
          echo "=== ssh-keyscan (verbose) ==="
          ssh-keyscan -v -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -v -o BatchMode=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo ok"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          SITE_URL: ${{ secrets.SITE_URL }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Write env file
        run: |
          cat > .env.production << 'EOF'
          NUXT_TURNSTILE_SECRET_KEY=${{ secrets.NUXT_TURNSTILE_SECRET_KEY }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NUXT_RESEND_API_KEY=${{ secrets.NUXT_RESEND_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL=${{ secrets.SITE_URL }}
          PORT=3002
          NODE_ENV=production
          EOF
          scp .env.production ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/apps/mschir.dev/.env

      - name: Deploy artifact
        run: |
          rsync -az --delete .output/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/apps/mschir.dev/.output/

      - name: Reload app
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "${{ env.PM2 }} reload mschir 2>/dev/null || (${{ env.PM2 }} start /apps/ecosystem.config.js --only mschir && ${{ env.PM2 }} save)"
